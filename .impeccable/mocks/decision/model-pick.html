<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>Red-Pen Notebook</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:390px; height:844px; overflow:hidden; color:#1d2b3a; font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC",system-ui,sans-serif;
    background:#fbfaf6; background-image:linear-gradient(#e6eef8 1px, transparent 1px), linear-gradient(90deg, #e6eef8 1px, transparent 1px); background-size:22px 22px; }
  header { padding:50px 20px 12px; border-bottom:2px solid #e0312b; display:flex; justify-content:space-between; align-items:flex-end; background:#fbfaf6; }
  header h2 { font-size:20px; font-weight:800; }
  header p { font-size:13px; font-weight:700; color:#55667a; }
  .goal { margin:14px 20px 0; font-size:14px; font-weight:700; color:#55667a; }
  .goal b { color:#e0312b; font-size:22px; }
  .board { margin:22px 20px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { position:relative; height:62px; background:#fff; border:1.5px solid #c8d3df; border-radius:6px; display:grid; place-items:center; font-weight:700; font-size:17px; }
  .card.sel { border-color:#2f6fd6; box-shadow:0 0 0 3px rgba(47,111,214,.18); }
  .card.ok::after { content:"✓"; position:absolute; right:10px; top:2px; color:#e0312b; font-size:30px; font-weight:900; transform:rotate(8deg); }
  .card.bad { border-color:#e0312b; }
  .card.bad::after { content:""; position:absolute; inset:-6px; border:2.5px solid #e0312b; border-radius:50%; transform:rotate(-3deg); }
  .note { margin:18px 20px 0; padding:10px 12px; border-left:3px solid #e0312b; background:#fff; font-size:14px; font-weight:700; color:#b0261f; }
  footer { position:absolute; bottom:30px; left:20px; right:20px; display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:#55667a; }
</style></head>
<body>
  <header><div><h2>第 9 组</h2><p>10 月 10 日 · 连续 6 天</p></div><p>12 / 25</p></header>
  <div class="goal">今天还剩 <b>8</b> 个词 · 约 2 分钟</div>
  <div class="board">
    <div class="card ok">摇摆</div><div class="card ok">sway</div>
    <div class="card sel">颗粒物</div><div class="card">furor</div>
    <div class="card bad">骚动</div><div class="card">particulate</div>
    <div class="card">块茎</div><div class="card">notorious</div>
    <div class="card">臭名昭著的</div><div class="card">tuber</div>
  </div>
  <div class="note">订正：骚动 = furor（不是 floor）</div>
  <footer><span>错题本 3</span><span>正确率 94%</span></footer>
</body></html>
