<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>Terminal Yellow</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:390px; height:844px; overflow:hidden; background:#f4f4f2; color:#111; font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC",system-ui,sans-serif; }
  .band { margin-top:44px; background:#ffd200; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; }
  .band .big { font-size:54px; font-weight:900; line-height:.9; }
  .band p { font-size:16px; font-weight:800; }
  .band .arrow { width:46px; height:46px; background:#111; color:#ffd200; display:grid; place-items:center; font-size:28px; font-weight:900; }
  .sub { padding:10px 20px; display:flex; justify-content:space-between; font-size:13px; font-weight:800; background:#111; color:#fff; }
  .board { margin:22px 20px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { height:64px; background:#fff; border:2px solid #111; display:grid; grid-template-columns:30px 1fr; align-items:center; padding:0 12px 0 0; font-weight:800; font-size:17px; }
  .card span { height:100%; display:grid; place-items:center; background:#111; color:#fff; font-size:15px; margin-right:10px; }
  .card.sel { background:#ffd200; }
  .card.ok { opacity:.35; }
  footer { position:absolute; bottom:28px; left:20px; right:20px; display:flex; justify-content:space-between; font-weight:800; font-size:13px; }
</style></head>
<body>
  <div class="band"><div><div class="big">8</div><p>今天还剩 8 个词 · 约 2 分钟</p></div><div class="arrow">→</div></div>
  <div class="sub"><span>第 9 组 12 / 25</span><span>连对 12 · 连续 6 天</span></div>
  <div class="board">
    <div class="card ok"><span>1</span>摇摆</div><div class="card ok"><span>6</span>sway</div>
    <div class="card sel"><span>2</span>颗粒物</div><div class="card"><span>7</span>furor</div>
    <div class="card"><span>3</span>骚动</div><div class="card"><span>8</span>particulate</div>
    <div class="card"><span>4</span>块茎</div><div class="card"><span>9</span>notorious</div>
    <div class="card"><span>5</span>臭名昭著的</div><div class="card"><span>0</span>tuber</div>
  </div>
  <footer><span>词库</span><span>设置</span></footer>
</body></html>
