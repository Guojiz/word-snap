<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>Rhythm Judge</title>
<style>
  :root { --stage:#f5f3ff; --ink:#1d1a4a; --muted:#5d5893; --lane:#e4e0ff; --sel:#7c5cff; --perfect:#b07a00; --great:#0b8f86; --good:#3c8a1e; --miss:#d6336c; }
  * { box-sizing:border-box; margin:0; }
  body { width:390px; height:844px; overflow:hidden; background:var(--stage); color:var(--ink); font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC",system-ui,sans-serif; }
  .num { font-family:"Saira Condensed","Barlow Condensed","Arial Narrow",sans-serif; font-weight:800; }
  header { padding:52px 20px 0; display:grid; grid-template-columns:28px 1fr auto; gap:12px; align-items:center; }
  .x { width:28px; height:28px; border-radius:8px; border:2px solid var(--lane); display:grid; place-items:center; color:var(--muted); font-weight:900; }
  .track { position:relative; height:14px; border-radius:7px; background:var(--lane); overflow:hidden; }
  .track i { position:absolute; inset:0 auto 0 0; width:48%; background:#7c5cff; border-radius:7px; }
  .track b { position:absolute; top:0; bottom:0; width:2px; background:#fff; opacity:.8; }
  .combo { text-align:right; line-height:1; }
  .combo .n { font-size:30px; color:var(--perfect); }
  .combo small { display:block; font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.08em; }
  .goal { margin:18px 20px 0; display:flex; align-items:baseline; gap:10px; color:var(--muted); font-weight:700; font-size:14px; }
  .goal .num { font-size:44px; color:var(--ink); line-height:.9; }
  .board { margin:34px 20px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px; position:relative; }
  .card { height:62px; border-radius:14px; background:#fff; border:2px solid #dcd7ff; display:grid; grid-template-columns:24px 1fr; align-items:center; padding:0 12px 0 10px; font-weight:800; font-size:17px; box-shadow:0 6px 14px rgba(36,32,90,.08); }
  .card span { color:#7e78b3; font-size:13px; }
  .card.sel { border-color:var(--sel); box-shadow:0 0 0 3px rgba(124,92,255,.22), 0 6px 14px rgba(36,32,90,.1); }
  .card.ok { background:#eafbf8; border-color:#2ec4b6; color:#0b6b64; }
  .judge { position:absolute; left:50%; top:-36px; transform:translateX(-50%) rotate(-4deg); font-size:34px; color:var(--perfect); }
  .judge em { font-style:normal; font-size:16px; color:var(--muted); margin-left:6px; }
  .legend { margin:26px 20px 0; display:flex; gap:14px; }
  .legend .num { font-size:16px; }
  footer { position:absolute; left:0; right:0; bottom:0; padding:14px 20px 30px; display:flex; justify-content:space-between; color:var(--muted); font-size:13px; font-weight:700; }
  footer b { color:var(--ink); }
</style></head>
<body>
  <header>
    <div class="x">×</div>
    <div class="track"><i></i><b style="left:20%"></b><b style="left:40%"></b><b style="left:60%"></b><b style="left:80%"></b></div>
    <div class="combo"><span class="num n">12</span><small>COMBO</small></div>
  </header>
  <div class="goal"><span class="num">8</span>今天还剩 8 个词 · 约 2 分钟 · 连续 6 天</div>
  <div class="board">
    <div class="judge num">PERFECT<em>0.9s</em></div>
    <div class="card ok"><span>1</span><div>摇摆</div></div>
    <div class="card ok"><span>6</span><div>sway</div></div>
    <div class="card sel"><span>2</span><div>颗粒物</div></div>
    <div class="card"><span>7</span><div>furor</div></div>
    <div class="card"><span>3</span><div>骚动</div></div>
    <div class="card"><span>8</span><div>particulate</div></div>
    <div class="card"><span>4</span><div>块茎</div></div>
    <div class="card"><span>9</span><div>notorious</div></div>
    <div class="card"><span>5</span><div>臭名昭著的</div></div>
    <div class="card"><span>0</span><div>tuber</div></div>
  </div>
  <div class="legend">
    <span class="num" style="color:var(--perfect)">PERFECT</span>
    <span class="num" style="color:var(--great)">GREAT</span>
    <span class="num" style="color:var(--good)">GOOD</span>
    <span class="num" style="color:var(--miss)">MISS</span>
  </div>
  <footer><span>第 9 组 · <b>12 / 25</b></span><span>正确率 <b>94%</b></span></footer>
</body></html>
