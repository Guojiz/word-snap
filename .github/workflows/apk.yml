# Builds the Android APK. A tag "v1.2.3" publishes a GitHub Release with the APK attached;
# "Run workflow" builds one to download from the run's artifacts.
# Signed release builds need four repository secrets (see MAINTAINING.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the workflow builds a debug APK instead.
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # versionCode grows with every run; versionName is the tag (or 0.0.<run>)
      WORD_SNAP_VERSION_CODE: ${{ github.run_number }}
      WORD_SNAP_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Web files into the app
        run: npm run build:www && npx cap sync android
      - name: Signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/word-snap-$WORD_SNAP_VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/word-snap-$WORD_SNAP_VERSION_NAME-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: word-snap-apk
          path: word-snap-*.apk
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" word-snap-*.apk --title "Word Snap $GITHUB_REF_NAME" --generate-notes
